# JitPack 服务器构建配置（https://jitpack.io/docs/BUILDING/）
# 放在仓库根目录，JitPack 会读取它来选择 JDK 版本、构建命令等。

jdk:
  - openjdk17

# 默认 install 命令是 ./gradlew clean install，但 Android Library 没有 install 任务。
# 这里显式指定发布到 mavenLocal，并发布所有可按需引入的子模块。
# JitPack 会注入 $VERSION 环境变量，把它传给 -PVERSION_NAME 让 jitpack.gradle 取到。
install:
  - ./gradlew
    :effect-core:publishToMavenLocal
    :effect-svga:publishToMavenLocal
    :effect-mp4-vap:publishToMavenLocal
    :effect-gif-glide:publishToMavenLocal
    -PVERSION_NAME=$VERSION


# 多模块仓库的依赖坐标会变成：
#   com.github.<USER>.<REPO>:effect-core:<TAG>
#   com.github.<USER>.<REPO>:effect-svga:<TAG>
#   com.github.<USER>.<REPO>:effect-mp4-vap:<TAG>
#   com.github.<USER>.<REPO>:effect-gif-glide:<TAG>
# （注意是点号，不是冒号）
#
# 按需引入说明：
#   effect-core 只提供队列调度、stage、下载等核心能力，不包含任何播放器实现。
#   SVGA 功能需要额外引入 effect-svga。
#   alpha-MP4/VAP 功能需要额外引入 effect-mp4-vap。
#   GIF/Glide 功能需要额外引入 effect-gif-glide。
#   未引入对应实现模块时，该格式不会有播放能力，也不会带入对应三方播放器依赖。
